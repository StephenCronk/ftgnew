name: Deploy to Hostinger (live site)

# Runs only when started by hand: Actions tab > "Deploy to Hostinger (live site)" > Run workflow.
# Needs repository secrets FTP_SERVER, FTP_USERNAME and FTP_PASSWORD.
on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Dry run: only list what would be uploaded or deleted"
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: hostinger
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: production
      url: https://fillingthegap.ca
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci

      - name: Build for the live domain
        run: npx eleventy
        env:
          PATH_PREFIX: /

      - name: Add Hostinger server config
        run: cp deploy/hostinger/.htaccess _site/.htaccess

      - name: Check the build before uploading
        run: |
          test -f _site/index.html
          if grep -rq '/ftgnew/' _site --include='*.html'; then echo "Build still has the dev path prefix"; exit 1; fi
          if grep -rq 'name="robots" content="noindex' _site --include='*.html'; then echo "Build is marked noindex"; exit 1; fi

      - name: Upload to Hostinger over FTPS
        # Pinned to the v4.4.0 commit because this step handles the FTP password.
        uses: SamKirkland/FTP-Deploy-Action@110f9186c050f71550953127052e77650219c287
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          port: 21
          protocol: ftps
          # Hostinger's certificate is issued to *.hstgr.io, not the server IP, so the
          # connection is encrypted but the certificate name is not checked.
          security: loose
          local-dir: ./_site/
          # The FTP account opens directly in the site's public_html, so upload to its root.
          server-dir: ./
          dry-run: ${{ inputs.dry_run }}
          # No clean-slate option: the action swallows errors from its delete step and then
          # uploads into whatever folder it was left in. Empty public_html in hPanel instead.
          exclude: |
            **/.git*
            **/.git*/**
            .nojekyll

      - name: Confirm the new homepage is live
        if: ${{ !inputs.dry_run }}
        # Ask the Hostinger server directly (FTP and web share an IP), so the CDN cache can't hide a bad upload.
        run: |
          html=$(curl -sk --max-time 30 --resolve "fillingthegap.ca:443:${{ secrets.FTP_SERVER }}" "https://fillingthegap.ca/")
          if ! grep -q '<title>Home - FillingTheGapDentalOutreach</title>' <<<"$html"; then
            echo "::error::fillingthegap.ca/ is not serving the new homepage. The files may have landed in the wrong folder."
            exit 1
          fi
          echo "Homepage is live on the origin server."
